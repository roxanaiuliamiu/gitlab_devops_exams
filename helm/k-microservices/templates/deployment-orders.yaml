apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
spec:
  replicas: {{ .Values.orders.replicaCount }}
  selector:
    matchLabels:
      app: orders
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: orders
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: orders
    spec:
      containers:
      - name: orders
        image: "{{ .Values.orders.image.repository }}:{{ .Values.orders.image.tag }}"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        spec:
        revisionHistoryLimit: 1
        args:
         - {{ .Values.orders.command | quote }}
        ports:
          - containerPort: {{ .Values.orders.containerPort }}
        envFrom:
          - configMapRef:
              name: orders-env