apiVersion: apps/v1
kind: Deployment
metadata:
  name: users
spec:
  revisionHistoryLimit: 1
  replicas: {{ .Values.users.replicaCount }}
  selector:
    matchLabels:
      app: users
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: users
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/component: users
    spec:
      containers:
      - name: users
        image: "{{ .Values.users.image.repository }}:{{ .Values.users.image.tag }}"
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
         - {{ .Values.users.command | quote }}
        ports:
          - containerPort: {{ .Values.users.containerPort }}
        envFrom:
          - configMapRef:
              name: users-env
