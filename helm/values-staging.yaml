
global:
  environment: staging
  host: api.staging.local

ingress:
  enabled: true
  className: nginx
  path: /

secrets:
  jwtSecretKey: staging-super-secret

gateway:
  replicaCount: 1
  containerPort: 8000
  image:
    repository: roxanaiuliamiu/k-api-gateway
    tag: latest

users:
  replicaCount: 1
  containerPort: 8000
  command: "uvicorn main:app --host 0.0.0.0 --port 8000 --loop asyncio"
  image:
    repository: roxanaiuliamiu/k-users
    tag: latest

orders:
  replicaCount: 1
  containerPort: 8000
  command: "uvicorn main:app --host 0.0.0.0 --port 8000 --loop asyncio"
  image:
    repository: roxanaiuliamiu/k-orders
    tag: latest
